<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha | ELNORA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background:#efe1cf">
  <main style="max-width:520px;margin:8vh auto;background:#fffaf3;padding:28px;border-radius:14px">
    <h1>Redefinir senha</h1>
    <p>Digite sua nova senha.</p>
    <form id="reset-password-form">
      <input id="new-password" type="password" minlength="8" required placeholder="Nova senha" style="width:100%;padding:12px;margin:12px 0">
      <button class="gold-action" type="submit">Salvar nova senha</button>
      <p id="reset-message" aria-live="polite"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config/config.js"></script>
  <script src="professional.js"></script>
  <script>
    document.getElementById("reset-password-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("new-password").value;
      const message = document.getElementById("reset-message");

      if (!window.ELNORA_PRO?.ready) {
        message.textContent = "Configure o Supabase antes de redefinir a senha.";
        return;
      }

      try {
        const { error } = await window.ELNORA_PRO.supabase.auth.updateUser({ password });
        if (error) throw error;
        message.textContent = "Senha atualizada. Você já pode entrar na sua conta.";
      } catch (error) {
        message.textContent = error?.message || "Não foi possível atualizar a senha.";
      }
    });
  </script>
</body>
</html>
